name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: spring-boot-app

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up JDK 23
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '23'

          - name: Build Jar with Maven
            run: mvn clean package -DskipTests

          - name: Building Docker image
            run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

          - name: Log in to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

          - name: Push Docker image to Docker Hub
            run: docker push ${{ env.IMAGE_NAME }}

          - name: Deploy to EC2
            uses: appleboy/ssh-action@1.2.0
            with:
              host: ${{ secrets.EC2_HOST }}
              username: ${{ secrets.EC2_USER }}
              key: ${{ secrets.EC2_KEY }}
              script: |
                docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
                docker stop spring-boot-app || true
                docker rm spring-boot-app || true
                docker run -d --name spring-boot-app -p 8081:8081 ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
                docker images prune -f
