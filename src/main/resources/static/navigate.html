<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="nav-header">
    <span class="back-btn" onclick="goBack()">←</span>
    <span class="nav-title">Indoor Navigation</span>
</div>

<div class="content">
    <div class="map-container">
        <!-- Simple Indoor SVG Map -->
        <svg viewBox="0 0 300 250" class="map">
            <!-- Rooms -->
            <rect x="20" y="80" width="60" height="40" class="room"/>
            <text x="30" y="105">Entrance</text>

            <rect x="120" y="80" width="60" height="40" class="room"/>
            <text x="135" y="105">Corridor</text>

            <rect x="220" y="20" width="60" height="40" class="room"/>
            <text x="235" y="45">Library</text>

            <rect x="220" y="140" width="60" height="40" class="room"/>
            <text x="235" y="165">Office</text>

            <rect x="20" y="140" width="60" height="40" class="room"/>
            <text x="35" y="165">Stairs</text>

            <rect x="20" y="200" width="60" height="40" class="room"/>
            <text x="35" y="225">Lab</text>

            <rect x="220" y="80" width="60" height="40" class="room"/>
            <text x="235" y="105">Admin</text>

            <!-- Paths -->
            <line x1="80" y1="100" x2="120" y2="100" class="path"/>
            <line x1="180" y1="100" x2="220" y2="40" class="path"/>
            <line x1="180" y1="100" x2="220" y2="100" class="path"/>
            <line x1="180" y1="100" x2="220" y2="160" class="path"/>
            <line x1="50" y1="120" x2="50" y2="140" class="path"/>
            <line x1="50" y1="180" x2="50" y2="200" class="path"/>

            <circle cx="50" cy="100" r="6" fill="#16a34a"/>
            <text x="30" y="120">You</text>

        </svg>
    </div>

    <div class="instructions-container">
        <h3>Navigation Instructions</h3>
        <div id="instructions"></div>
        <div class="nav-controls">
            <button id="prevBtn" onclick="prevStep()" disabled>Previous</button>
            <button id="nextBtn" onclick="nextStep()">Next</button>
        </div>
    </div>
</div>

<script src="js/navigation.js"></script>
</body>
</html>
